<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Perfect Lab Black Friday</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root{
    --gold-1:#8a6a2f; --gold-2:#c9a34e; --gold-3:#f3dc9a; --gold-4:#fff4cf;
    --gold-grad:linear-gradient(100deg,#7d5e26 0%,#c9a34e 18%,#f6e3a6 34%,#fff6d6 42%,#d9b45e 52%,#a9822f 66%,#f1d58c 82%,#8a6a2f 100%);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;background:#000;overflow:hidden}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000}
  canvas,.layer{position:absolute;inset:0}
  .abs{position:absolute;left:0;right:0;text-align:center;white-space:nowrap;font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1;will-change:transform,opacity,filter}
  .gold{background:var(--gold-grad);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
  .serif{font-family:'Cormorant Garamond',serif}
  .sans{font-family:'Montserrat',sans-serif}
  .ar{font-family:'El Messiri',sans-serif;direction:rtl}
  .ar2{font-family:'Tajawal',sans-serif;direction:rtl}

  /* footage */
  #foot{position:absolute;inset:0;overflow:hidden;opacity:0}
  #foot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 45%}
  #foot .shade{position:absolute;inset:0;
    background:
      linear-gradient(180deg,rgba(0,0,0,.70) 0%,rgba(0,0,0,.05) 22%,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 68%,rgba(0,0,0,.92) 100%),
      radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 100%);}
  #foot .tint{position:absolute;inset:0;background:linear-gradient(160deg,rgba(201,163,78,.16),rgba(0,0,0,0) 50%,rgba(201,163,78,.10));mix-blend-mode:soft-light}

  /* scene 1 */
  #s1logo{position:absolute;left:50%;top:520px;width:236px;height:292px;margin-left:-118px}
  #s1logo img{width:100%;height:100%;display:block}
  #s1bf{top:1020px;font-size:116px;font-weight:600;letter-spacing:.06em;line-height:1}
  #s1here{top:1190px;font-size:40px;font-weight:300;letter-spacing:.62em;color:#f4efe4;padding-left:.62em}
  .hair{position:absolute;left:50%;height:2px;background:linear-gradient(90deg,rgba(201,163,78,0),#e9cd84 50%,rgba(201,163,78,0));transform-origin:50% 50%}
  #s1line{top:1160px;width:520px;margin-left:-260px}

  /* scene 2 */
  #s2mini{position:absolute;left:50%;top:150px;width:58px;height:72px;margin-left:-29px}
  #s2mini img{width:100%;height:100%}
  #s2a{top:1270px;font-size:104px;font-weight:400;font-style:italic;color:#fbf7ee;line-height:1}
  #s2b{top:1384px;font-size:104px;font-weight:600;line-height:1.05;letter-spacing:.01em}
  #s2line{top:1240px;width:300px;margin-left:-150px}

  /* scene 3 */
  #s3kick{top:470px;font-size:30px;font-weight:400;letter-spacing:.7em;padding-left:.7em;color:#d9bd77}
  #s3num{top:540px;font-size:470px;font-weight:600;line-height:1;letter-spacing:-.01em}
  #s3egp{top:1060px;font-size:60px;font-weight:300;letter-spacing:.42em;padding-left:.42em;color:#fbf7ee}
  #s3egp b{font-weight:500;color:#f0d48a}
  #s3line{top:1182px;width:440px;margin-left:-220px}
  #s3ar{top:1236px;font-size:66px;font-weight:600;color:#fbf7ee;line-height:1.5}
  #s3ar span{font-weight:700}

  /* scene 4 */
  #card{position:absolute;left:50%;top:290px;width:520px;height:668px;margin-left:-260px;border-radius:34px;
    background:#fff;overflow:hidden}
  #card::before{content:"";position:absolute;inset:0;border-radius:34px;padding:3px;
    background:linear-gradient(140deg,#8a6a2f,#f6e3a6 30%,#c9a34e 55%,#fff1c2 75%,#8a6a2f);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;z-index:2}
  #card img{position:absolute;left:50%;top:50%;width:440px;height:581px;margin:-290px 0 0 -220px}
  #cardshine{position:absolute;top:-20%;bottom:-20%;width:180px;background:linear-gradient(90deg,rgba(255,240,200,0),rgba(255,236,190,.55),rgba(255,240,200,0));transform:skewX(-18deg);mix-blend-mode:multiply;opacity:.0;z-index:1}
  #glow{position:absolute;left:50%;top:624px;width:900px;height:1000px;margin:-500px 0 0 -450px;border-radius:50%;
    background:radial-gradient(ellipse at center,rgba(232,196,110,.42) 0%,rgba(201,163,78,.16) 34%,rgba(201,163,78,0) 66%)}
  #s4ar{top:1030px;font-size:54px;font-weight:500;color:#fbf7ee;line-height:1.55;padding:0 90px;white-space:normal}
  #s4ar span{font-weight:700;white-space:nowrap}
  #s4line{top:1232px;width:380px;margin-left:-190px}
  #s4brand{top:1262px;font-size:86px;font-weight:600;letter-spacing:.24em;padding-left:.24em;line-height:1}
  #s4tag{top:1372px;font-size:50px;font-weight:500;color:#efe6d2;line-height:1.5}

  #flare{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen}
  #fade{position:absolute;inset:0;background:#000;pointer-events:none}
  #grain{mix-blend-mode:overlay;opacity:.16}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1080" height="1920"></canvas>

  <div id="foot"><img id="footimg" alt=""><div class="tint"></div><div class="shade"></div></div>

  <!-- scene 1 -->
  <div id="s1logo"><img src="logo.png" alt=""></div>
  <div class="hair" id="s1line"></div>
  <div class="abs serif gold" id="s1bf">BLACK FRIDAY</div>
  <div class="abs sans" id="s1here">IS HERE!</div>

  <!-- scene 2 -->
  <div id="s2mini"><img src="logo.png" alt=""></div>
  <div class="hair" id="s2line"></div>
  <div class="abs serif" id="s2a">Your Health</div>
  <div class="abs serif gold" id="s2b">Deserves the Best!</div>

  <!-- scene 3 -->
  <div class="abs sans" id="s3kick">BLACK FRIDAY</div>
  <div class="abs serif gold" id="s3num">100</div>
  <div class="abs sans" id="s3egp"><b>EGP</b> ONLY</div>
  <div class="hair" id="s3line"></div>
  <div class="abs ar" id="s3ar">تحاليل طبية مختارة بـ <span class="gold">100 جنيه فقط!</span></div>

  <!-- scene 4 -->
  <div id="glow"></div>
  <div id="card"><img src="hero-logo.jpeg" alt="PERFECT LAB"><div id="cardshine"></div></div>
  <div class="abs ar" id="s4ar">اهتم بصحتك واستفيد بعروض <span class="gold">الوايت فرايداي</span> من برفكت لاب.</div>
  <div class="hair" id="s4line"></div>
  <div class="abs serif gold" id="s4brand">PERFECT LAB</div>
  <div class="abs ar" id="s4tag">دقة تثق فيها.. ورعاية تستحقها.</div>

  <canvas id="flare" width="1080" height="1920"></canvas>
  <canvas id="grain" width="540" height="960" style="width:1080px;height:1920px"></canvas>
  <div id="fade"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const clamp = (x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg = (t,a,b)=>clamp((t-a)/(b-a));
const eOut = x=>1-Math.pow(1-x,3);
const eOut5 = x=>1-Math.pow(1-x,5);
const eIO = x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const lerp=(a,b,x)=>a+(b-a)*x;
// window: fade in over [a,a+fi], out over [b-fo,b]
const win=(t,a,b,fi=.6,fo=.6)=>Math.min(eOut(seg(t,a,a+fi)), 1-eIO(seg(t,b-fo,b)));

function set(el,{o=1,y=0,s=1,blur=0,ls=null,x=0}={}){
  el.style.opacity=o;
  el.style.transform=`translate(${x}px,${y}px) scale(${s})`;
  el.style.filter=blur>0.05?`blur(${blur}px)`:'none';
  if(ls!==null) el.style.letterSpacing=ls;
}

// deterministic RNG
function rng(seed){return ()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(7);
const dust=[...Array(120)].map(()=>({x:R()*1080,y:R()*1920,r:.6+R()*2.4,sp:8+R()*26,ph:R()*6.28,tw:.6+R()*1.8,dx:(R()-.5)*14}));

// grain frames
const grainFrames=[];
(function(){const r=rng(99);for(let k=0;k<6;k++){const c=document.createElement('canvas');c.width=540;c.height=960;const g=c.getContext('2d');const im=g.createImageData(540,960);for(let i=0;i<im.data.length;i+=4){const v=r()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}g.putImageData(im,0,0);grainFrames.push(c)}})();

const bg=$('bg').getContext('2d'), fl=$('flare').getContext('2d'), gr=$('grain').getContext('2d');

function drawBG(t, amount, ringP){
  bg.globalCompositeOperation='source-over';
  bg.fillStyle='#000';bg.fillRect(0,0,1080,1920);
  if(amount<=0) return;
  bg.globalAlpha=amount;
  // deep warm base vignette
  let g=bg.createRadialGradient(540,900,50,540,900,1250);
  g.addColorStop(0,'#17110a');g.addColorStop(.55,'#070503');g.addColorStop(1,'#000');
  bg.fillStyle=g;bg.fillRect(0,0,1080,1920);
  bg.globalCompositeOperation='lighter';
  // soft drifting golden reflections
  const blobs=[[300,520,520,.20,.13,0],[820,1380,600,.16,.09,2],[620,900,420,.12,.17,4],[180,1600,380,.10,.11,1]];
  for(const [bx,by,br,a,sp,ph] of blobs){
    const x=bx+Math.sin(t*sp+ph)*120, y=by+Math.cos(t*sp*.8+ph)*90;
    g=bg.createRadialGradient(x,y,0,x,y,br);
    g.addColorStop(0,`rgba(214,170,84,${a})`);g.addColorStop(.5,`rgba(150,110,45,${a*.35})`);g.addColorStop(1,'rgba(0,0,0,0)');
    bg.fillStyle=g;bg.fillRect(0,0,1080,1920);
  }
  // diagonal satin light bands (like reflections on black silk)
  bg.save();bg.translate(540,960);bg.rotate(-0.52);
  for(const [off,w,a,sp] of [[-500,260,.07,38],[150,140,.09,-26],[620,320,.05,30]]){
    const cx=off+((t*sp)%1600+1600)%1600-800+ (off*0);
    g=bg.createLinearGradient(cx-w,0,cx+w,0);
    g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.5,`rgba(240,205,130,${a})`);g.addColorStop(1,'rgba(0,0,0,0)');
    bg.fillStyle=g;bg.fillRect(cx-w,-1400,2*w,2800);
  }
  bg.restore();
  // gold dust
  for(const d of dust){
    const y=((d.y - t*d.sp)%1920+1920)%1920, x=d.x+Math.sin(t*.5+d.ph)*d.dx;
    const a=(.35+.65*Math.max(0,Math.sin(t*d.tw+d.ph)))*.75;
    g=bg.createRadialGradient(x,y,0,x,y,d.r*5);
    g.addColorStop(0,`rgba(255,226,150,${a})`);g.addColorStop(.25,`rgba(230,185,95,${a*.45})`);g.addColorStop(1,'rgba(0,0,0,0)');
    bg.fillStyle=g;bg.fillRect(x-d.r*5,y-d.r*5,d.r*10,d.r*10);
  }
  // ring behind the 100
  if(ringP>0){
    bg.globalCompositeOperation='lighter';
    const cx=540, cy=800, r=410;
    const p=eIO(clamp(ringP));
    const st=-Math.PI/2 + t*.12;
    bg.lineWidth=2.2;
    let rg=bg.createLinearGradient(cx-r,cy-r,cx+r,cy+r);
    rg.addColorStop(0,'rgba(140,105,45,.0)');rg.addColorStop(.35,'rgba(240,210,140,.85)');rg.addColorStop(.65,'rgba(201,163,78,.6)');rg.addColorStop(1,'rgba(140,105,45,.1)');
    bg.strokeStyle=rg;bg.beginPath();bg.arc(cx,cy,r,st,st+p*Math.PI*2);bg.stroke();
    bg.lineWidth=1;bg.strokeStyle=`rgba(220,185,110,${.35*p})`;bg.beginPath();bg.arc(cx,cy,r+26,-st,-st-p*Math.PI*2,true);bg.stroke();
    // center bloom
    g=bg.createRadialGradient(cx,cy,0,cx,cy,520);
    g.addColorStop(0,`rgba(230,190,105,${.22*p})`);g.addColorStop(1,'rgba(0,0,0,0)');
    bg.fillStyle=g;bg.fillRect(0,0,1080,1920);
  }
  bg.globalAlpha=1;bg.globalCompositeOperation='source-over';
}

// light sweep flare used at transitions; p in 0..1 crosses frame
function drawFlare(p, strength){
  fl.clearRect(0,0,1080,1920);
  if(strength<=0) return;
  fl.save();fl.globalCompositeOperation='lighter';
  const x=lerp(-500,1580,p);
  fl.translate(x,960);fl.rotate(0.35);
  let g=fl.createLinearGradient(-320,0,320,0);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.42,`rgba(200,150,60,${.35*strength})`);
  g.addColorStop(.5,`rgba(255,236,190,${.85*strength})`);g.addColorStop(.58,`rgba(200,150,60,${.35*strength})`);g.addColorStop(1,'rgba(0,0,0,0)');
  fl.fillStyle=g;fl.fillRect(-320,-1500,640,3000);
  fl.restore();
  // bloom
  g=fl.createRadialGradient(x,960,0,x,960,700);
  g.addColorStop(0,`rgba(255,220,150,${.25*strength})`);g.addColorStop(1,'rgba(0,0,0,0)');
  fl.globalCompositeOperation='lighter';fl.fillStyle=g;fl.fillRect(0,0,1080,1920);fl.globalCompositeOperation='source-over';
}

function shine(el,t,speed=.18,ph=0){ el.style.backgroundPosition=`${(((t*speed+ph)%1)*-160+130)}% 50%`; }

const footImg=$('footimg');
function loadFoot(i){
  return new Promise(res=>{
    const src=`fr2/${String(i).padStart(4,'0')}.jpg`;
    if(footImg.getAttribute('src')===src && footImg.complete) return res();
    footImg.onload=()=>res(); footImg.onerror=()=>res(); footImg.src=src;
  });
}

async function render(t){
  const FPS=30;
  // ---------- background
  const bgAmt = Math.max(win(t,0,4.35,.9,.5), win(t,9.6,25.5,.7,.1));
  const ringP = t<17.6 ? seg(t,10.3,12.2) * (1-seg(t,17.4,18.2)) : 0;
  drawBG(t,bgAmt,ringP);

  // ---------- SCENE 1 (0-4)
  const s1out = 1-eIO(seg(t,3.55,4.1));
  const lp=eOut5(seg(t,.35,1.7));
  set($('s1logo'),{o:lp*s1out,s:lerp(.86,1,lp)*lerp(1,1.04,seg(t,1.7,4)),blur:lerp(14,0,lp),y:lerp(30,0,lp)});
  $('s1logo').style.filter=(lp<1?`blur(${lerp(14,0,lp)}px) `:'')+`drop-shadow(0 0 ${lerp(10,38,.5+.5*Math.sin(t*2))}px rgba(232,190,100,.55))`;
  const bp=eOut(seg(t,1.25,2.45));
  set($('s1bf'),{o:bp*s1out,y:lerp(26,0,bp),blur:lerp(10,0,bp),ls:`${lerp(.24,.06,eOut5(seg(t,1.25,2.9)))}em`});
  shine($('s1bf'),t,.22);
  $('s1bf').style.filter=($('s1bf').style.filter==='none'?'':$('s1bf').style.filter)+' drop-shadow(0 0 22px rgba(220,175,85,.35))';
  const lnp=eOut(seg(t,1.9,2.8));
  set($('s1line'),{o:lnp*s1out});$('s1line').style.transform=`scaleX(${lnp})`;
  const hp=eOut(seg(t,2.25,3.1));
  set($('s1here'),{o:hp*s1out,y:lerp(18,0,hp),ls:`${lerp(.9,.62,hp)}em`});

  // ---------- SCENE 2 (4-10)
  const footO = eOut(seg(t,3.85,4.45)) * (1-eIO(seg(t,9.45,10.05)));
  $('foot').style.opacity=footO;
  if(footO>0){
    const fi=clamp(Math.floor((t-3.85)*FPS)+1,1,188);
    await loadFoot(fi);
    const local=(t-3.85)%1.5;
    footImg.style.transform=`scale(${lerp(1.10,1.02,local/1.8)})`;
  }
  const s2out=1-eIO(seg(t,9.3,9.8));
  set($('s2mini'),{o:win(t,4.4,9.8,.8,.5)*.95});
  const ap=eOut(seg(t,4.8,5.7)), bp2=eOut(seg(t,5.25,6.3));
  set($('s2line'),{o:eOut(seg(t,4.6,5.4))*s2out});$('s2line').style.transform=`scaleX(${eOut(seg(t,4.6,5.6))})`;
  set($('s2a'),{o:ap*s2out,y:lerp(30,0,ap),blur:lerp(8,0,ap)});
  set($('s2b'),{o:bp2*s2out,y:lerp(30,0,bp2),blur:lerp(8,0,bp2)});
  shine($('s2b'),t,.2,.3);
  $('s2a').style.textShadow='0 4px 30px rgba(0,0,0,.6)';

  // ---------- SCENE 3 (10-18)
  const s3out=1-eIO(seg(t,17.35,18.0));
  const kp=eOut(seg(t,10.2,11.0));
  set($('s3kick'),{o:kp*s3out*.95,y:lerp(14,0,kp),ls:`${lerp(1.0,.7,kp)}em`});
  const np=eOut5(seg(t,10.35,11.7));
  const breathe=1+.012*Math.sin((t-11.7)*1.6)*seg(t,11.7,12.5);
  set($('s3num'),{o:np*s3out,s:lerp(1.22,1,np)*breathe,blur:lerp(22,0,np)});
  shine($('s3num'),t,.16,.55);
  const glowA=.30+.12*Math.sin(t*1.8);
  $('s3num').style.filter=(np<1?`blur(${lerp(22,0,np)}px) `:'')+`drop-shadow(0 0 ${30+14*Math.sin(t*1.8)}px rgba(232,190,100,${glowA})) drop-shadow(0 10px 30px rgba(0,0,0,.8))`;
  const ep=eOut(seg(t,11.3,12.2));
  set($('s3egp'),{o:ep*s3out,y:lerp(20,0,ep),ls:`${lerp(.7,.42,ep)}em`});
  const l3=eOut(seg(t,12.0,12.9));
  set($('s3line'),{o:l3*s3out});$('s3line').style.transform=`scaleX(${l3})`;
  const arp=eOut(seg(t,12.5,13.5));
  set($('s3ar'),{o:arp*s3out,y:lerp(26,0,arp),blur:lerp(8,0,arp)});
  shine($('s3ar').querySelector('span'),t,.2,.1);

  // ---------- SCENE 4 (18-25)
  const cp=eOut5(seg(t,17.9,19.3));
  const endFade=1-eIO(seg(t,24.45,25.0));
  set($('card'),{o:cp,s:lerp(.9,1,cp)*lerp(1,1.025,seg(t,19.3,25)),y:lerp(40,0,cp),blur:lerp(12,0,cp)});
  $('card').style.boxShadow=`0 0 ${60+25*Math.sin(t*1.7)}px rgba(232,190,100,${.45+.15*Math.sin(t*1.7)}), 0 30px 80px rgba(0,0,0,.7)`;
  const gp=seg(t,17.9,19.6);
  set($('glow'),{o:eOut(gp)*(.85+.15*Math.sin(t*1.7)),s:lerp(.7,1,eOut(gp))});
  const sh=seg(t,19.4,20.6);
  $('cardshine').style.left=lerp(-260,620,eIO(sh))+'px';
  $('cardshine').style.opacity=(sh>0&&sh<1)?.9:0;
  const a4=eOut(seg(t,19.6,20.6));
  set($('s4ar'),{o:a4,y:lerp(24,0,a4),blur:lerp(8,0,a4)});
  shine($('s4ar').querySelector('span'),t,.2,.4);
  const l4=eOut(seg(t,20.9,21.8));
  set($('s4line'),{o:l4});$('s4line').style.transform=`scaleX(${l4})`;
  const b4=eOut(seg(t,21.1,22.2));
  set($('s4brand'),{o:b4,y:lerp(20,0,b4),ls:`${lerp(.4,.24,b4)}em`});
  shine($('s4brand'),t,.18,.2);
  $('s4brand').style.filter=($('s4brand').style.filter==='none'?'':$('s4brand').style.filter)+' drop-shadow(0 0 18px rgba(220,175,85,.35))';
  const tg=eOut(seg(t,21.8,22.8));
  set($('s4tag'),{o:tg,y:lerp(20,0,tg),blur:lerp(6,0,tg)});

  // ---------- flares at transitions
  let fp=0,fs=0;
  if(t>=0.1&&t<1.6){fp=seg(t,.1,1.6);fs=.55*Math.sin(Math.PI*fp)}
  else if(t>=3.5&&t<4.5){fp=seg(t,3.5,4.5);fs=Math.sin(Math.PI*fp)}
  else if(t>=10.3&&t<11.6){fp=seg(t,10.3,11.6);fs=.6*Math.sin(Math.PI*fp)}
  else if(t>=17.5&&t<18.6){fp=seg(t,17.5,18.6);fs=.8*Math.sin(Math.PI*fp)}
  drawFlare(fp,fs);

  // ---------- grain & global fades
  gr.drawImage(grainFrames[Math.floor(t*FPS)%6],0,0);
  const fadeIn=1-eOut(seg(t,0,.7));
  $('fade').style.opacity=Math.max(fadeIn,1-endFade);
}
window.render=render;
</script>
</body>
</html>
